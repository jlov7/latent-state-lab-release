name: Numerical checkpoint probe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-tensor-probe.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m latent_state_lab.tensor_probe
